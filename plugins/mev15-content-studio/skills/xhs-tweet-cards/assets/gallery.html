<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #0f1419; background: #eef2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: inherit; }
    .topbar { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(15, 20, 25, .08); background: rgba(255, 255, 255, .92); backdrop-filter: blur(16px); }
    .topbar-inner { display: flex; width: min(1560px, calc(100% - 32px)); min-height: 62px; margin: 0 auto; align-items: center; justify-content: space-between; gap: 16px; }
    .back { color: #536471; font-size: 14px; font-weight: 650; text-decoration: none; }
    .back:hover { color: #1d9bf0; }
    .badge { padding: 6px 10px; border-radius: 999px; color: #176a9f; background: #e4f4ff; font-size: 12px; font-weight: 750; }
    .page { width: min(1560px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 72px; }
    .hero { max-width: 820px; margin-bottom: 30px; }
    .eyebrow { margin-bottom: 12px; color: #1d9bf0; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.2; letter-spacing: -.035em; }
    .intro { margin: 14px 0 0; color: #536471; font-size: 15px; line-height: 1.8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .toolbar a { padding: 8px 12px; border: 1px solid #d8e2e8; border-radius: 9px; background: #fff; color: #536471; font-size: 13px; font-weight: 650; text-decoration: none; }
    .toolbar a:hover { border-color: #8ecdf2; color: #1378b6; }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
    figure { margin: 0; padding: 10px; border: 1px solid #dce5ea; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(15, 20, 25, .06); }
    figure a { display: block; border-radius: 12px; overflow: hidden; background: #fff; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 11px 4px 3px; color: #536471; font-size: 13px; text-align: center; }
    details { margin-top: 28px; border: 1px solid #dce5ea; border-radius: 16px; background: #fff; overflow: hidden; }
    summary { padding: 17px 20px; cursor: pointer; color: #176a9f; font-weight: 750; }
    pre { margin: 0; padding: 0 20px 22px; color: #33404a; font: 14px/1.8 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; white-space: pre-wrap; }
    .caption-status { color: #7b8995; }
    @media (max-width: 840px) { .gallery { grid-template-columns: 1fr; } .page { padding-top: 30px; } }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      {{BACK_LINK}}
      <span class="badge">{{BADGE}}</span>
    </div>
  </nav>
  <main class="page">
    <header class="hero">
      <div class="eyebrow">XHS TWEET CARDS</div>
      <h1>{{ARTICLE_TITLE}}</h1>
      <p class="intro">{{DESCRIPTION}}</p>
      <div class="toolbar">
        <a href="manifest.json">查看 manifest.json</a>
        <a href="caption.txt">查看 caption.txt</a>
      </div>
    </header>
    <section class="gallery" aria-label="卡片列表">
{{GALLERY_ITEMS}}
    </section>
    <details id="caption-panel">
      <summary>查看小红书发帖文案</summary>
      <pre id="caption" class="caption-status">正在读取 caption.txt…</pre>
    </details>
  </main>
  <script>
    fetch("caption.txt", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.text();
      })
      .then((text) => {
        const target = document.getElementById("caption");
        target.classList.remove("caption-status");
        target.textContent = text.trim();
      })
      .catch(() => {
        document.getElementById("caption").textContent = "caption.txt 尚未生成；完成发帖文案后刷新本页即可。";
      });
  </script>
</body>
</html>
